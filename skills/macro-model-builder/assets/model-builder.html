<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Model Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: the tutor chat on the left; the work on the right in tabs (sketch: outline | source | rendered page; the source draft's PDF; progress).
   Companion to Margin Questions: same type and palette family, green-slate accent so the two are told apart. */
:root {
  --desk: #e3e7e6;
  --panel: #f6f8f7;
  --paper: #ffffff;
  --ink: #1b2422;
  --muted: #5a6865;
  --line: #d0d8d6;
  --accent: #1f6b5c;
  --accent-soft: rgba(31, 107, 92, .10);
  --you: #eef3f2;
  --danger: #b3261e;
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --prose: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #111614; --panel: #171d1b; --paper: #1d2422; --ink: #e2e9e7; --muted: #95a5a1; --line: #2a3431;
    --accent: #6fc2ad; --accent-soft: rgba(111, 194, 173, .15); --you: #212b28; --danger: #f07a72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #111614; --panel: #171d1b; --paper: #1d2422; --ink: #e2e9e7; --muted: #95a5a1; --line: #2a3431;
  --accent: #6fc2ad; --accent-soft: rgba(111, 194, 173, .15); --you: #212b28; --danger: #f07a72;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--desk); color: var(--ink); font: 14px/1.45 var(--ui); overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
/* fixed rows: when the banner is hidden, .main must still take the filling row, not slide into the banner's auto row */
.app > header.bar { grid-row: 1; }
.app > .banner { grid-row: 2; }
.app > .main { grid-row: 3; }
header.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); }
.bar .what { color: var(--muted); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .grow { flex: 1; }
.stamp { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stamp.warn { color: var(--accent); }
/* build progress: one segment per block of the build order; settled = full, draft = half */
.pbar { display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; background: transparent; padding: 3px 6px; border-radius: 6px; }
.pbar:hover { border-color: var(--line); background: var(--paper); }
.psegs { display: inline-flex; gap: 2px; }
.pseg { width: 14px; height: 8px; border-radius: 2px; background: var(--line); }
.pseg.draft { background: linear-gradient(90deg, var(--accent) 50%, var(--line) 50%); }
.pseg.settled { background: var(--accent); }
.pseg.current { outline: 1.5px solid var(--accent); outline-offset: 1px; }
.pbar .pct { font-size: 12px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.pbig { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 4px 0 10px; }
.pbig span { display: block; height: 100%; background: var(--accent); }
.blist { font: 14px/1.4 var(--ui); display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
.brow { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; }
.brow:hover { background: var(--accent-soft); }
.brow .bico { color: var(--accent); width: 1em; text-align: center; }
.brow .bname { flex: 1; }
.brow.current .bname { font-weight: 600; }
.brow .bst { color: var(--muted); font-size: 12.5px; }
.prog .page + .page { margin-top: 16px; }
.pnote { font: 12.5px/1.4 var(--ui); color: var(--muted); margin: 0; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 5px 10px; line-height: 1.2; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--accent-soft); }
.banner { background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: 13px;
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.main { display: grid; grid-template-columns: var(--chatCol, minmax(320px, 36%)) minmax(0, 1fr); min-height: 0; }
/* drag handles for the chat and outline widths; double-click resets */
.resizer { position: absolute; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 5; touch-action: none; }
.resizer::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px; background: transparent; transition: background .15s; }
.resizer:hover::after, .resizer.drag::after { background: var(--accent); }
.chat > .resizer { right: -4px; }
.main.only-chat .resizer, .main.only-work .resizer { display: none; }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
body.resizing iframe, body.resizing textarea { pointer-events: none; }
/* one panel full width; a single column, so the visible panel never lands in the chat's narrow track */
.main.only-chat, .main.only-work { grid-template-columns: minmax(0, 1fr); }
.main.only-chat .work, .main.only-work .chat { display: none; }
.main.only-chat .chat { border-right: 0; }
.main.only-chat .thread, .main.only-chat .composer { padding-inline: max(16px, calc((100% - 780px) / 2)); }
.mtabs { display: none; }

/* ---- chat ---- */
.chat { position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; min-width: 0; background: var(--panel); border-right: 1px solid var(--line); }
.msg a.eqlink, .msg a[href^="#"] { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 2px; cursor: pointer; white-space: nowrap; }
.msg a.eqlink:hover, .msg a[href^="#"]:hover { text-decoration-style: solid; }
.thread { overflow: auto; padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 100%; min-width: 0; }
.msg.you { align-self: flex-end; background: var(--you); border: 1px solid var(--line); border-radius: 10px 10px 2px 10px; padding: 8px 11px; max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.tutor { font: 15px/1.6 var(--prose); overflow-wrap: anywhere; }
.msg.tutor p { margin: 0 0 .65em; }
.msg.tutor p:last-child { margin-bottom: 0; }
.msg.tutor ul, .msg.tutor ol { margin: 0 0 .65em; padding-left: 1.3em; }
.msg.tutor code { font: 13px var(--mono); background: var(--accent-soft); padding: 0 3px; border-radius: 3px; }
.msg.tutor pre { overflow-x: auto; background: var(--accent-soft); padding: 8px; border-radius: 6px; }
.msg.tutor blockquote, .msg.you blockquote { margin: 0 0 .5em; padding-left: 10px; border-left: 3px solid var(--line); color: var(--muted); }
.msg mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
.msg .by { font: 11px var(--ui); color: var(--muted); margin-top: 4px; }
.handoff { border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px 10px; background: var(--paper); }
.handoff .hhead { display: flex; align-items: center; justify-content: space-between; font: 12px var(--ui); color: var(--muted); margin-bottom: 4px; }
.handoff .hhead .btn { padding: 2px 8px; font-size: 12px; }
.handoff .msg.tutor { font-size: 14px; }
.editnote { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 6px; margin-top: 6px; padding: 3px 4px 3px 8px; border-left: 2px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; font: 12.5px/1.4 var(--ui); color: var(--muted); }
.editnote span { flex: 1; min-width: 12em; }
.editnote .btn { padding: 2px 8px; font-size: 12.5px; color: var(--accent); }
.welcome { color: var(--muted); font-size: 13.5px; border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; }
.welcome b { color: var(--ink); }
.thinking { color: var(--muted); display: flex; gap: 8px; align-items: center; font-size: 13px; }
.thinking::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
@media (prefers-reduced-motion: reduce) { .thinking::before { animation: none; } }
.err { color: var(--danger); font-size: 13px; }
.composer { border-top: 1px solid var(--line); padding: 10px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
textarea { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); padding: 8px 10px; resize: vertical; }
textarea:focus { outline: none; border-color: var(--accent); }
#ask { min-height: 64px; max-height: 40vh; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row .grow { flex: 1; }
.kbd { font-size: 12px; color: var(--muted); }

/* ---- work ---- */
.work { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }
.tabs { display: flex; gap: 2px; align-items: flex-end; border-bottom: 1px solid var(--line); background: var(--panel); padding: 6px 12px 0; flex-wrap: wrap; }
.tab { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 6px 12px; border-radius: 6px 6px 0 0; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--desk); border-color: var(--line); color: var(--ink); font-weight: 500; margin-bottom: -1px; }
.tabs .grow { flex: 1; }
.tabs .tools { display: flex; gap: 6px; padding-bottom: 6px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--paper); padding: 4px 9px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
.pane { min-height: 0; overflow: hidden; display: grid; grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); } /* one stretched cell: the tab's content fills the pane's height */
.pane[hidden] { display: none !important; }

.sketch { position: relative; min-height: 0; display: grid; grid-template-columns: var(--outlineW, 200px) minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.sketch > .resizer { left: calc(var(--outlineW, 200px) - 4px); }
.sketch.no-outline > .resizer { display: none; }
/* fixed columns, so hiding one part never slides another into a zero-width column */
.sketch .outline { grid-column: 1; grid-row: 1; }
.sketch .src { grid-column: 2; grid-row: 1; }
.sketch .preview { grid-column: 3; grid-row: 1; }
.sketch.v-source { grid-template-columns: var(--outlineW, 200px) minmax(0, 1fr) 0; }
.sketch.v-source .preview { display: none; }
.sketch.v-preview { grid-template-columns: var(--outlineW, 200px) 0 minmax(0, 1fr); }
.sketch.v-preview .src { display: none; }
.sketch.no-outline { grid-template-columns: 0 minmax(0, 1fr) minmax(0, 1fr); }
.sketch.no-outline.v-source { grid-template-columns: 0 minmax(0, 1fr) 0; }
.sketch.no-outline.v-preview { grid-template-columns: 0 0 minmax(0, 1fr); }
.sketch.no-outline .outline { display: none; }
.outline { overflow: auto; border-right: 1px solid var(--line); padding: 10px 8px; font-size: 13px; background: var(--panel); }
.outline h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 2px 4px 6px; font-weight: 600; }
.outline button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 4px 6px; border-radius: 5px; }
.outline button:hover { background: var(--accent-soft); }
.outline .l2 { padding-left: 16px; color: var(--muted); }
.outline .env { padding-left: 16px; color: var(--muted); font-size: 12.5px; }
.outline .empty { color: var(--muted); font-size: 12.5px; padding: 4px 6px; }
.src { min-width: 0; min-height: 0; display: flex; }
#tex { flex: 1; border: 0; border-radius: 0; resize: none; font: 13px/1.6 var(--mono); padding: 14px 16px; background: var(--paper); tab-size: 2; white-space: pre; overflow: auto; }
.preview { overflow: auto; border-left: 1px solid var(--line); background: var(--desk); padding: 18px 16px 80px; }
.page { background: var(--paper); max-width: 760px; margin: 0 auto; padding: 40px 48px 56px; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 6px 18px rgba(0,0,0,.06);
  font: 15.5px/1.65 var(--prose); overflow-wrap: anywhere; }
.page h1 { font: 600 22px/1.3 var(--prose); text-align: center; margin: 0 0 6px; text-wrap: balance; }
.page .sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 26px; }
.page h2 { font: 600 18px/1.3 var(--prose); margin: 1.6em 0 .5em; text-wrap: balance; }
.page h3 { font: 600 16px/1.3 var(--prose); margin: 1.2em 0 .4em; }
.page p { margin: 0 0 .8em; }
.page .thm { margin: .9em 0; }
.page .thm .h { font-weight: 600; }
.page .thm.it { font-style: italic; }
.page .proof .h { font-style: italic; }
.page .atype { font-style: normal; color: var(--accent); font: 500 12px var(--ui); letter-spacing: .03em; text-transform: uppercase; margin-right: 4px; }
.page .moment { font: 12.5px/1.4 var(--ui); color: var(--muted); border-left: 2px solid var(--accent); padding-left: 6px; display: inline-block; margin: 2px 0; }
.page .math { overflow-x: auto; overflow-y: hidden; }
.page table { border-collapse: collapse; margin: .6em auto; font-size: 14px; }
.page td { padding: 3px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.page tr:first-child td { font-weight: 600; border-bottom: 2px solid var(--ink); }
.page .center { text-align: center; }
.page .placeholder { color: var(--muted); }
.page .flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.page.emptypage { text-align: center; color: var(--muted); font: 14px/1.5 var(--ui); }

.pdfwrap { position: relative; height: 100%; overflow: auto; padding: 18px 16px 60px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.pdfwrap canvas { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18); max-width: 100%; height: auto; }
.pdfmark { position: absolute; pointer-events: none; border-radius: 4px; background: var(--accent-soft); outline: 2px solid var(--accent); animation: markfade 3.5s ease-out forwards; }
@keyframes markfade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
.pdfmsg { color: var(--muted); margin-top: 40px; text-align: center; max-width: 420px; }
.prog { height: 100%; overflow: auto; padding: 18px 16px 60px; }
.prog .page { font-size: 15px; }
.prog .page h1 { text-align: left; font-size: 20px; }
.prog .page li { margin: .2em 0; }

@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .mtabs { display: flex; gap: 4px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .main.show-work .chat { display: none; }
  .main:not(.show-work) .work { display: none; }
  .chat { border-right: 0; }
  /* narrow: split stacks source over page; the id outranks the wide-layout class rules */
  #sketch { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  #sketch.v-source, #sketch.v-preview { grid-template-rows: minmax(0, 1fr); }
  #sketch .outline { display: none; }
  .resizer { display: none !important; }
  #sketch .src { grid-column: 1; grid-row: 1; }
  #sketch .preview { grid-column: 1; grid-row: 2; display: block; border-left: 0; border-top: 1px solid var(--line); }
  #sketch.v-source .preview { display: none; }
  #sketch.v-preview .src { display: none; }
  #sketch.v-preview .preview { grid-row: 1; border-top: 0; }
  .page { padding: 24px 18px 40px; }
  .bar .what, #layoutSeg { display: none; }
  .pseg { width: 8px; }
}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><span class="dot" aria-hidden="true"></span>Model Builder</div>
    <span class="what" id="what">Guided build</span>
    <button class="pbar" id="pbar" hidden><span class="psegs" id="psegs" aria-hidden="true"></span><span class="pct" id="pct"></span></button>
    <span class="seg" id="layoutSeg" role="group" aria-label="Panels">
      <button id="lChat" aria-pressed="false" title="Chat only">Chat</button><button id="lBoth" aria-pressed="true" title="Chat and sketch side by side">Both</button><button id="lWork" aria-pressed="false" title="Sketch only">Sketch</button>
    </span>
    <span class="grow"></span>
    <span class="stamp" id="stamp">Loading…</span>
    <button class="btn" id="exportBtn" title="Download the sketch as main.tex (packed in a .zip; a .tex file can't be downloaded from here directly)">Export .tex</button>
    <select class="btn" id="modelSel" aria-label="Model for the tutor">
      <option value="opus">Opus 5.5 · most careful</option>
      <option value="opusq">Opus 5.5 · quicker</option>
      <option value="sonnet">Sonnet 5.5 · fastest</option>
    </select>
    <a class="btn" id="reader" hidden target="_blank" rel="noopener" title="Ask about a passage of a PDF">Margin Questions ↗</a>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="main" id="main">
    <nav class="mtabs" aria-label="Panels">
      <button class="btn" id="mChat">Chat</button>
      <button class="btn" id="mWork">Sketch &amp; draft</button>
    </nav>
    <section class="chat" aria-label="Tutor">
      <div class="resizer" id="chatResizer" role="separator" aria-orientation="vertical" aria-label="Resize chat" title="Drag to resize · double-click to reset"></div>
      <div class="thread" id="thread"></div>
      <div class="composer">
        <textarea id="ask" placeholder="Write your answer, a derivation in LaTeX, or a question…" aria-label="Message to the tutor"></textarea>
        <div class="row">
          <button class="btn ghost" id="clearBtn" title="Delete this chat to keep the tutor's context small. The tutor first writes a short note on where you are, which it keeps.">Clear</button>
          <span class="kbd" id="ctxSize" title="Rough size of what the tutor reads on every message: rules, draft, progress, sketch and this chat"></span>
          <span class="kbd grow" id="sendHint" title="Snippets: mk → $…$, md → $$…$$ (⌘Z undoes)">↵ send · ⇧↵ new line</span>
          <button class="btn" id="stopBtn" hidden>Stop</button>
          <button class="btn" id="retryBtn" hidden>Retry</button>
          <button class="btn primary" id="sendBtn">Send</button>
        </div>
      </div>
    </section>
    <section class="work" aria-label="Work">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="t-sketch" aria-selected="true">Sketch</button>
        <button class="tab" role="tab" id="t-draft" aria-selected="false">Draft</button>
        <button class="tab" role="tab" id="t-prog" aria-selected="false">Progress</button>
        <span class="grow"></span>
        <span class="tools" id="sketchTools">
          <button class="btn ghost" id="quoteBtn" title="Quote the selected source lines in the chat">Quote in chat</button>
          <button class="btn ghost" id="outlineBtn" title="Show or hide the outline">Outline</button>
          <span class="seg" role="group" aria-label="View">
            <button id="vSplit" aria-pressed="true">Split</button><button id="vSource" aria-pressed="false">Source</button><button id="vPreview" aria-pressed="false">Page</button>
          </span>
        </span>
      </div>
      <div class="pane" id="p-sketch">
        <div class="sketch" id="sketch">
          <div class="resizer" id="outlineResizer" role="separator" aria-orientation="vertical" aria-label="Resize outline" title="Drag to resize · double-click to reset"></div>
          <nav class="outline" id="outline" aria-label="Outline"><h2>Outline</h2><div id="outlineList"></div></nav>
          <div class="src"><textarea id="tex" spellcheck="false" aria-label="Sketch source (LaTeX)"></textarea></div>
          <div class="preview" id="preview"><article class="page" id="pageOut"></article></div>
        </div>
      </div>
      <div class="pane" id="p-draft" hidden><div class="pdfwrap" id="pdfwrap"><p class="pdfmsg">Open this tab to load the source draft.</p></div></div>
      <div class="pane" id="p-prog" hidden><div class="prog"><article class="page" id="blocksOut"></article><article class="page" id="progOut"></article></div></div>
    </section>
  </div>
</div>

<script>
window.MathJax = {

/* ---------- export: the sketch as main.tex ----------

   (one file, stored uncompressed). If downloads aren't available here, the source is copied to the clipboard instead. */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  const d = new Date(), time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const lh = new DataView(new ArrayBuffer(30)), cd = new DataView(new ArrayBuffer(46)), end = new DataView(new ArrayBuffer(22));
  const put = (v) => ([o, x, w]) => (w === 4 ? v.setUint32(o, x, true) : v.setUint16(o, x, true));
  [[0, 0x04034b50, 4], [4, 20], [6, 0x0800], [10, time], [12, date], [14, crc, 4], [18, n, 4], [22, n, 4], [26, nm.length]].forEach(put(lh));
  [[0, 0x02014b50, 4], [4, 20], [6, 20], [8, 0x0800], [12, time], [14, date], [16, crc, 4], [20, n, 4], [24, n, 4], [28, nm.length]].forEach(put(cd));
  [[0, 0x06054b50, 4], [8, 1], [10, 1], [12, 46 + nm.length, 4], [16, 30 + nm.length + n, 4]].forEach(put(end));

}

}

/* ---------- source draft PDF ---------- */
function loadPDF() { // resolves to { pages: [{ page, canvas, viewport }] }, or null when the draft can't be shown
  if (S.pdfP) return S.pdfP;
  const wrap = $("pdfwrap");
  if (!S.ref.pdfAssetId) { wrap.innerHTML = '<p class="pdfmsg">The source draft isn\'t attached yet. Claude Code uploads it when it sets up Model Builder.</p>'; return Promise.resolve(null); }
  if (!window.pdfjsLib) { wrap.innerHTML = '<p class="pdfmsg">The PDF reader didn\'t load. Check your connection and reload.</p>'; return Promise.resolve(null); }
  wrap.innerHTML = '<p class="pdfmsg">Opening the draft…</p>';
  S.pdfP = (async () => {
    try {
      const r = await fetch("/_blob/" + S.ref.pdfAssetId);
      if (!r.ok) throw new Error("the file is missing (" + r.status + ")");
      const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await r.arrayBuffer()), isEvalSupported: false }).promise;
      wrap.innerHTML = "";
      const width = Math.min(wrap.clientWidth - 32, 900);
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const vp = page.getViewport({ scale: (width / page.getViewport({ scale: 1 }).width) * dpr });
        const c = document.createElement("canvas");
        c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        c.style.width = Math.floor(vp.width / dpr) + "px";
        c.setAttribute("aria-label", "Source draft, page " + i);
        wrap.appendChild(c);
        await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
        pages.push({ page, canvas: c, viewport: vp });
      }
      return { pages };
    } catch (e) {
      S.pdfP = null;
      wrap.innerHTML = `<p class="pdfmsg">The draft didn't open: ${esc(e.message || e)}.</p>`;
      return null;
    }
  })();
  return S.pdfP;
}

/* ---------- tutor ---------- */
/* check:begin */
// The tutor's rules: model/ref.rules when the user stored their own, else these. {{learner}} ({{Learner}} at the start
// of a sentence), {{brief}}, {{order}} and {{short}} are filled in from model/ref.
const GENERIC_RULES = `You are the tutor in {{learner}}'s guided build of a macroeconomic model. {{Learner}}'s goal is to learn to build models themselves; the process matters as much as the result. Their background and level, when known, are in the project brief.

The project: {{brief}}

Pace (this comes first; a build that crawls and gets caught in the weeds is the usual failure):
- Work top-down. Get the whole model onto the page as a skeleton before perfecting any block: the environment, each agent's problem, prices and market clearing, the equilibrium definition, then the experiment. A block can stand as a rough draft and be refined later. Never polish one block while later blocks are still empty.
- The build order sets the next step. The progress file's next step, open items in the sketch's comments and Tutor notes are a backlog for after the skeleton is closed. Where they conflict with these rules, these rules win.
- A step is a block, not an equation. Ask {{learner}} for a whole block at once (e.g. all first-order conditions of one agent) and check it in one pass.
- When the build extends a source draft, take the draft's assumptions and results as given and re-derive only what the extension changes. For mechanical blocks, ask {{learner}} to write the specialized block in one go, or, if they prefer, file it into the sketch yourself; then move on. No hint-by-hint guidance for substitutions.
- Spend hint-by-hint effort only where the model says something new: the economics that the source draft or standard results don't already state, and the experiment.
- A condition may stand in endogenous objects for now (a cutoff, a price, a value function). Restating it in parameters only is a refinement for after the skeleton is closed, unless a later block needs it sooner.
- Park side issues instead of resolving them: generality, corner cases, existence and uniqueness, whether one assumption implies another, inconsistencies in the source draft, notation choices. Write them in one line starting "Parked:" and keep going. If a point hasn't resolved after two exchanges, park it.
- {{Learner}} can always say "park it" or "move on": do so at once.

How you work (guided build):
- {{Learner}} does the derivations that carry the mechanism. You set up each step with ONE hint or ONE narrowing question, then check what they write.
- Keep momentum. Most of a build is standard machinery (Bellman equations, first-order conditions, market clearing, laws of motion). When their step is right, confirm it in one line and move to the next step. Stop them only for an error that changes a result.
- Take regularity conditions as given and never make them a step: positive parameters where the model needs them, discount factors in (0,1), the standard assumptions on functional forms, interior solutions, finite integrals, and anything the source draft already assumes. Where the draft is silent on a sign, the standard sign holds, and if {{learner}} relies on it, accept it. Don't ask {{learner}} to state, label or justify them. If one actually decides a result, say so in one sentence at the point where it bites.
- Notation slips, typos, a wrong label or reason on a right result, and harmless departures from the source draft are not steps. Correct them in a few words yourself (naming what a quantity {{learner}} already derived is not stating a result) or fix them when filing into the sketch, and carry on.
- Routine algebra (substituting, rearranging, collecting terms) is not where the learning is. If {{learner}} is stuck on it, or asks, just show it.
- Ask for a plan first only before a genuinely long argument (an existence or uniqueness proof, a comparative static with several channels). Not for a value function, a FOC, a market-clearing condition or a substitution.
- End every reply with exactly one question or one instruction. Never a list of questions.
- A hint narrows the search without containing the answer.
- Don't state a result that carries the mechanism (a cutoff, a sign, a comparative static) before {{learner}} derives it, and don't preview what the model will deliver. If they explicitly ask for the answer, give it: they decide.
- When you check their work, point to the first place it goes wrong and say why. Do not rewrite all of it.
- If they repeat the same wrong idea or say they are stuck, give a foothold (do the first step, or name the missing condition) and hand the pen back.
- Use the source draft's notation exactly and cite its equations as the project brief says (e.g. ({{short}}.13)). Write math in LaTeX: $...$ inline, $$...$$ displayed.
- Equation references are clickable for {{learner}}. Write a draft equation as plain text ({{short}}.13), outside math; it links itself. Refer to an equation in {{learner}}'s sketch with a markdown link to its \\label key, showing its number: [(3)](#eq:bellman). If it has no label, link the number: [(3)](#3). Use the numbers and keys from the equation list below; never put these references inside $...$.
- Craft rules, applied with judgment: the smallest model that produces the mechanism comes first; label a modelling choice critical or convenience only when it is substantive (the market structure, price setting, entry, what is fixed and what is endogenous), never a regularity condition; when a parameter that will be calibrated first appears, name its identifying moment in one line, without quizzing.
- When a block is settled, say so in one line starting "Settled:", file it into the sketch yourself, and make your one instruction the next block in the build order.
- Keep the build tracker current with set_progress. Mark a block draft when a rough version of it first appears in the sketch, and settled in the same reply where you write "Settled:". If the tracker below disagrees with the sketch or the progress file, fix it. Don't mention the tracker or the percentage in your reply: {{learner}} sees the bar.
- You can change {{learner}}'s sketch (main.tex) with the edit_sketch tool: exact find-and-replace, each old_text copied verbatim and matching exactly once. Use write_sketch only when the sketch is empty or {{learner}} asks for a full rewrite. The sketch shown below is as of {{learner}}'s message; call read_sketch if you need it fresh. Edit when a block is settled (filing what {{learner}} derived) or when {{learner}} asks: fixing LaTeX, restructuring, renaming, adding labels. Don't write a result into the sketch that {{learner}} hasn't derived unless they ask you to. Match the sketch's notation, macros and style, and keep existing \\label keys. Edits save at once and {{learner}} can undo them; after editing, say in one line what you changed.
- Be brief: usually under 120 words, longer only for a displayed derivation or when {{learner}} asks. Short, plain sentences. No preamble, no praise unless something specific earned it.

Build order: {{order}}.`;
const L = () => S.ref.learner || "the learner";
const cap1 = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function fill(text) {
  const v = { learner: L(), Learner: cap1(L()), brief: S.ref.brief || `(no brief stored; ask ${L()} what model they are building)`,
    order: S.ref.order || DEFAULT_ORDER, short: S.ref.short || "Draft" };
  return String(text).replace(/\{\{(learner|Learner|brief|order|short)\}\}/g, (_, k) => v[k]);
}
const RULES = () => fill(S.ref.rules || GENERIC_RULES);
function contextBlock() {
  const cap = (s, n) => (s.length > n ? s.slice(0, n) + "\n[… cut for length]" : s);
  return `${RULES()}

${S.handoff ? `Where the previous chat left off (${L()} cleared it; the tutor wrote this note just before):
<handoff>
${cap(S.handoff, 4000)}
</handoff>

` : ""}Where the build stands (PROGRESS.md, as of the last sync):
<progress>
${cap(S.progress || "(not synced yet)", 12000)}
</progress>

/* ---------- start ---------- */
(async function start() {
  setTab(LS.get("mb.tab", "t-sketch") in TABS ? LS.get("mb.tab", "t-sketch") : "t-sketch");
  renderThread(); renderPreview(); renderProgress(); renderStatus();
  const use = window.claude && window.claude.use ? (n) => window.claude.use(n).catch(() => null) : async () => null;
  const [sample, db, dl] = await Promise.all([use("sample"), use("db"), use("downloads")]);
  S.sample = sample; S.db = db; S.dl = dl;
  renderThread();
  if (!db) { setStamp(); banner("Open this page inside Claude to load and save the sketch and the chat."); return; }
  let timer; const slow = new Promise((r) => { timer = setTimeout(() => r("timeout"), 10000); });
  const got = await Promise.race([Promise.all([
    db.doc("model/ref").get(), db.doc("model/progress").get(), db.collection("chat").orderBy("t").limit(1000).get(),
    db.doc("model/handoff").get().catch(() => null), db.doc("model/status").get().catch(() => null),
  ]).catch((e) => ({ err: e })), slow]);
  clearTimeout(timer);
  if (got === "timeout") { banner("Your saved sketch can't be reached right now. Try reloading in a minute."); setStamp(); return; }
  if (got.err) { banner("The saved sketch didn't load (" + (got.err.code || "error") + ")."); setStamp(); return; }
  const [ref, prog, chat, hand, stat] = got;
  if (hand && hand.exists) S.handoff = String(hand.data().md || "");
  if (ref.exists) { S.ref = { ...S.ref, ...ref.data() }; if (S.ref.short) $("t-draft").textContent = S.ref.short; const rh = readerHref(S.ref); if (rh) { $("reader").href = rh; $("reader").hidden = false; } }
  if (prog.exists) { S.progress = String(prog.data().md || ""); renderProgress(); }
  if (stat && stat.exists) S.status = statusFromDoc(stat.data());
  S.statusLoaded = true; renderStatus();
  S.chat = chat.docs.map((d) => ({ id: d.id, ...d.data() }));
  renderThread();
  if ($("p-draft").hidden === false) loadPDF();
  // the sketch stays live, so a sync from Claude Code shows up without a reload
  db.doc("model/sketch").onSnapshot((snap) => { if (snap.exists) applyRemoteSketch(snap.data()); else setStamp(); },
    (e) => banner("Live updates to the sketch stopped (" + (e && e.code || "error") + "). Reload to resume."));
  db.doc("model/status").onSnapshot((snap) => { if (snap.exists) { S.status = statusFromDoc(snap.data()); renderStatus(); } }, () => {});
  db.doc("model/progress").onSnapshot((snap) => { if (snap.exists) { const md = String(snap.data().md || ""); if (md !== S.progress) { S.progress = md; renderProgress(); } } }, () => {});
})();
</script>
